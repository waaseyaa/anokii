name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ANOKII_COMMUNITY_ID: ci-community
      WAASEYAA_DB: /tmp/anokii-ci.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: fileinfo, zip
      - uses: ramsey/composer-install@v3
      - run: composer validate --strict
      - run: composer audit --locked --no-interaction
      - name: Build production field-access preflight
        run: |
          ANOKII_PRIVACY_SECRET="$(php -r 'echo str_repeat("p", 32);')"
          WAASEYAA_JWT_SECRET="$(php -r 'echo str_repeat("j", 32);')"
          WAASEYAA_APP_SECRET="base64:$(php -r 'echo base64_encode(str_repeat("a", 32));')"
          AUTH_TOKEN_SECRET="$(php -r 'echo bin2hex(random_bytes(32));')"
          export ANOKII_PRIVACY_SECRET WAASEYAA_JWT_SECRET WAASEYAA_APP_SECRET AUTH_TOKEN_SECRET
          APP_ENV=local php vendor/bin/waaseyaa db:init --sync-schema
          APP_ENV=production composer readiness:field-access
          APP_ENV=production php vendor/bin/waaseyaa list >/dev/null
      - run: composer test

  frankenphp-http:
    runs-on: ubuntu-latest
    env:
      ANOKII_COMMUNITY_ID: ci-community
      WAASEYAA_DB: /tmp/anokii-frankenphp.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: fileinfo, zip
      - uses: ramsey/composer-install@v3
      - name: Install FrankenPHP 1.12.4
        run: |
          curl -fsSL -o /tmp/frankenphp "https://github.com/php/frankenphp/releases/download/v1.12.4/frankenphp-linux-x86_64"
          echo "b39c7511483c99faf0d857cc0789b39cc23023038260b31d4b40dd4ae18795dc  /tmp/frankenphp" | sha256sum -c -
          chmod +x /tmp/frankenphp
          /tmp/frankenphp version
      - name: Production FrankenPHP worker gate
        env:
          FRANKENPHP_BINARY: /tmp/frankenphp
        run: |
          ANOKII_PRIVACY_SECRET="$(php -r 'echo str_repeat("p", 32);')"
          WAASEYAA_JWT_SECRET="$(php -r 'echo str_repeat("j", 32);')"
          WAASEYAA_APP_SECRET="base64:$(php -r 'echo base64_encode(str_repeat("a", 32));')"
          AUTH_TOKEN_SECRET="$(php -r 'echo bin2hex(random_bytes(32));')"
          export ANOKII_PRIVACY_SECRET WAASEYAA_JWT_SECRET WAASEYAA_APP_SECRET AUTH_TOKEN_SECRET
          bash scripts/acceptance-frankenphp-http.sh

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: fileinfo, zip
      - uses: ramsey/composer-install@v3
      - run: composer analyse
      - run: composer style

  package-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: mbstring
      - run: composer validate --working-dir=packages/core --strict --no-check-lock
      - run: composer validate --working-dir=packages/identity --strict --no-check-lock
      - run: composer validate --working-dir=packages/operator --strict --no-check-lock
      - name: Install Identity as a minimal external consumer
        env:
          CORE_PATH: ${{ github.workspace }}/packages/core
          IDENTITY_PATH: ${{ github.workspace }}/packages/identity
        run: |
          mkdir -p /tmp/anokii-identity-consumer
          # PHP source below intentionally uses single quotes.
          # shellcheck disable=SC2016
          php -r '
            file_put_contents("/tmp/anokii-identity-consumer/composer.json", json_encode([
              "name" => "waaseyaa/anokii-identity-consumer-smoke",
              "type" => "project",
              "require" => [
                "php" => "^8.5",
                "waaseyaa/anokii-core" => "dev-main",
                "waaseyaa/anokii-identity" => "dev-main",
              ],
              "repositories" => [
                ["type" => "path", "url" => getenv("CORE_PATH"), "options" => [
                  "symlink" => false,
                  "versions" => ["waaseyaa/anokii-core" => "dev-main"],
                ]],
                ["type" => "path", "url" => getenv("IDENTITY_PATH"), "options" => [
                  "symlink" => false,
                  "versions" => ["waaseyaa/anokii-identity" => "dev-main"],
                ]],
              ],
              "minimum-stability" => "alpha",
              "prefer-stable" => true,
              "config" => ["sort-packages" => true],
            ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          '
          composer update --working-dir=/tmp/anokii-identity-consumer --no-interaction
          for forbidden in waaseyaa/full waaseyaa/ai-agent waaseyaa/deployer waaseyaa/anokii; do
            if composer show --working-dir=/tmp/anokii-identity-consumer "$forbidden" >/dev/null 2>&1; then
              echo "Forbidden distribution dependency installed: $forbidden" >&2
              exit 1
            fi
          done
          # shellcheck disable=SC2016
          php -r '
            require "/tmp/anokii-identity-consumer/vendor/autoload.php";
            foreach ([
              Anokii\Core\Access\AbstractEntityAccessPolicy::class,
              Anokii\Identity\Entity\Pillar::class,
              Anokii\Identity\Access\IdentityPillarAccessPolicy::class,
              Anokii\Identity\IdentityServiceProvider::class,
            ] as $class) {
              if (!class_exists($class)) { throw new RuntimeException("Missing " . $class); }
            }
          '
          composer dump-autoload --working-dir=/tmp/anokii-identity-consumer --optimize --no-interaction
          # shellcheck disable=SC2016
          php -r 'require "/tmp/anokii-identity-consumer/vendor/autoload.php"; if (!class_exists(Anokii\Identity\Entity\Pillar::class)) { exit(1); }'
      - name: Install Operator as a minimal external consumer
        env:
          OPERATOR_PATH: ${{ github.workspace }}/packages/operator
        run: |
          mkdir -p /tmp/anokii-operator-consumer
          # PHP source below intentionally uses single quotes.
          # shellcheck disable=SC2016
          php -r '
            file_put_contents("/tmp/anokii-operator-consumer/composer.json", json_encode([
              "name" => "waaseyaa/anokii-operator-consumer-smoke",
              "type" => "project",
              "require" => [
                "php" => "^8.5",
                "waaseyaa/anokii-operator" => "dev-main",
              ],
              "repositories" => [["type" => "path", "url" => getenv("OPERATOR_PATH"), "options" => [
                "symlink" => false,
                "versions" => ["waaseyaa/anokii-operator" => "dev-main"],
              ]]],
              "minimum-stability" => "alpha",
              "prefer-stable" => true,
              "config" => ["sort-packages" => true],
            ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          '
          composer update --working-dir=/tmp/anokii-operator-consumer --no-interaction
          for forbidden in waaseyaa/full waaseyaa/ai-agent waaseyaa/deployer waaseyaa/anokii; do
            if composer show --working-dir=/tmp/anokii-operator-consumer "$forbidden" >/dev/null 2>&1; then
              echo "Forbidden distribution dependency installed: $forbidden" >&2
              exit 1
            fi
          done
          # shellcheck disable=SC2016
          php -r '
            require "/tmp/anokii-operator-consumer/vendor/autoload.php";
            foreach ([
              Anokii\Operator\Http\OperatorResponsePolicy::class,
              Anokii\Operator\Module\OperatorModuleCatalog::class,
              Anokii\Operator\Shell\OperatorShell::class,
              Anokii\Operator\Template\OperatorTemplates::class,
            ] as $class) {
              if (!class_exists($class)) { throw new RuntimeException("Missing " . $class); }
            }
          '
